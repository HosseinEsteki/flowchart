<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowCraft - Collaborative Flowchart Studio</title>
    <meta name="description" content="Professional collaborative flowchart editor with real-time team collaboration, cloud sync, version history, image/PDF/HTML export, and multi-theme customization." />
    <meta property="og:title" content="FlowCraft - Collaborative Flowchart Studio" />
    <meta property="og:description" content="Professional collaborative flowchart editor with real-time team collaboration, cloud sync, version history, image/PDF/HTML export, and multi-theme customization." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Ignore HMR and WebSocket transport errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        if (
          event &&
          (event.message?.includes('WebSocket') ||
           event.message?.includes('@vite/client') ||
           event.message?.includes('createWebSocketModuleRunnerTransport') ||
           event.filename?.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event &&
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason?.stack || '').includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="overflow-hidden antialiased bg-slate-50 text-slate-900 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
